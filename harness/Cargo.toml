[package]
name = "mixlab"
version = "0.1.0"
edition = "2021"
default-run = "mixlab"
description = "Evaluation and search harness for multiply-xorshift integer mixers"

[dependencies]
rayon = "1.10"
# GPU backend (default feature `gpu`): CUDA driver + NVRTC, loaded at runtime,
# so builds need no CUDA install and run on the CPU without one.
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13000"] }

[features]
default = ["gpu"]
gpu = ["dep:cudarc"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.test]
opt-level = 3
